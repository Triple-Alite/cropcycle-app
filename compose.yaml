services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cropcycle
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: cropcycle
    ports:
      - "5432:5432"
    volumes:
      - cropcycle_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropcycle -d cropcycle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cropcycle_pg_data:
